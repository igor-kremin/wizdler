<!DOCTYPE html>
<html lang="en"><head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Wizdler · WSDL explorer</title>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { overflow: hidden; background: #f5f7fb; }
body { width: 560px; height: 600px; margin: 0; display: flex; flex-direction: column; color: #172b4d; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
button, input { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
button:focus-visible, a:focus-visible { outline: 3px solid #9ac0ff; outline-offset: 2px; }
.popup-header { flex: none; padding: 18px 20px 0; background: #fff; border-bottom: 1px solid #e2e8f0; }
.brand-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.brand-mark { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; background: #2563eb; color: #fff; font-size: 14px; font-weight: 750; }
.brand-name { font-weight: 700; letter-spacing: -.2px; }
.context-label { margin-left: auto; color: #64748b; font-size: 12px; }
.heading-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.service-heading { min-width: 0; flex: 1; }
h1 { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 21px; line-height: 1.3; letter-spacing: -.45px; }
#service-source { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; color: #64748b; font-size: 12px; }
.download-button { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border: 1px solid #dbe3ef; border-radius: 7px; background: #fff; color: #334155; font-size: 12px; font-weight: 600; }
.download-button:hover:not(:disabled) { background: #eff6ff; border-color: #bfd3f8; color: #1d4ed8; }
.download-button svg { width: 15px; height: 15px; flex: none; }
.search-box { display: flex; align-items: center; gap: 9px; height: 42px; padding: 0 11px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; }
.search-box:focus-within { border-color: #3b82f6; box-shadow: 0 0 0 3px #dbeafe; background: #fff; }
.search-box svg { width: 18px; height: 18px; color: #64748b; flex: none; }
#method-search { flex: 1; min-width: 0; padding: 0; border: 0; outline: 0; background: transparent; color: #172b4d; }
#method-search::-webkit-search-cancel-button { -webkit-appearance: none; }
#method-search::placeholder { color: #94a3b8; }
#clear-search { width: 23px; height: 25px; padding: 0; border: 0; border-radius: 4px; background: #e8eef6; color: #475569; font-size: 19px; line-height: 1; }
kbd { padding: 0 5px; border: 1px solid #dbe3ef; border-radius: 4px; background: #fff; color: #94a3b8; font-family: inherit; font-size: 12px; line-height: 21px; }
.search-summary { display: flex; align-items: center; justify-content: space-between; min-height: 43px; gap: 12px; color: #64748b; font-size: 12px; }
.text-button { padding: 3px 0; border: 0; background: transparent; color: #2563eb; font-size: 12px; }
.text-button:hover:not(:disabled) { text-decoration: underline; }
#tree { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; scrollbar-color: #cbd5e1 transparent; scrollbar-width: thin; }
ul { list-style: none; padding: 0; margin: 0; }
.service-group + .service-group { margin-top: 18px; }
.service-label { margin: 4px 8px 8px; color: #64748b; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.port-group { margin-bottom: 10px; border: 1px solid #e0e7f0; border-radius: 9px; overflow: hidden; background: #fff; }
.port-toggle { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 9px 12px; border: 0; background: #eef2f8; color: #334155; text-align: left; }
.port-toggle:hover:not(:disabled) { background: #e7edf6; }
.port-toggle:disabled { opacity: 1; }
.chevron { width: 7px; height: 7px; margin: -3px 2px 0 0; border-right: 1.5px solid #64748b; border-bottom: 1.5px solid #64748b; transform: rotate(45deg); flex: none; }
.collapsed .chevron { transform: rotate(-45deg); margin-top: 0; }
.port-name { font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.protocol-tag { flex: none; padding: 1px 6px; border: 1px solid #d6dfeb; border-radius: 4px; background: #f8fafc; color: #64748b; font-size: 10px; font-weight: 600; }
.group-count { margin-left: auto; color: #64748b; font-size: 11px; }
.operation-row + .operation-row { border-top: 1px solid #f0f3f8; }
.operation-link { display: flex; align-items: center; gap: 10px; min-height: 43px; padding: 9px 12px; text-decoration: none; color: #183b63; }
.operation-link:hover, .operation-link:focus { background: #eff6ff; color: #1d4ed8; }
.method-icon { display: grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 6px; background: #eff6ff; color: #3b82f6; font: 11px ui-monospace, Consolas, monospace; }
.operation-copy { flex: 1; min-width: 0; }
.operation-name { display: block; overflow-wrap: anywhere; font-size: 14px; font-weight: 550; }
.operation-description { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #8491a5; font-size: 11px; }
.operation-arrow { opacity: 0; color: #2563eb; font-size: 17px; }
.operation-link:hover .operation-arrow, .operation-link:focus .operation-arrow { opacity: 1; }
mark { padding: 0; border-radius: 2px; background: #fef0ad; color: inherit; }
.empty-state { padding: 38px 24px; text-align: center; color: #64748b; }
.empty-state strong { display: block; margin-bottom: 5px; color: #334155; font-size: 15px; }
.empty-state p { margin: 4px 0 12px; font-size: 13px; }
#popup-message { flex: none; margin: 0; padding: 10px 20px; border-top: 1px solid #dbeafe; background: #eff6ff; color: #1e40af; font-size: 12px; white-space: pre-line; max-height: 110px; overflow-y: auto; }
#popup-message.error { border-color: #fecaca; background: #fff1f2; color: #b42338; }
.popup-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; min-height: 36px; padding: 8px 20px; border-top: 1px solid #e2e8f0; background: #fff; color: #64748b; font-size: 11px; }
.footer-shortcut { white-space: nowrap; color: #94a3b8; }
body.busy .operation-link { cursor: progress; opacity: .65; }
</style>
</head><body>
<header class="popup-header">
	<div class="brand-row"><span class="brand-mark" aria-hidden="true">W</span><span class="brand-name">Wizdler</span><span class="context-label">WSDL explorer</span></div>
	<div class="heading-row">
		<div class="service-heading"><h1 id="service-title">Loading service…</h1><span id="service-source">Reading the current page</span></div>
		<button id="download-wsdl" class="download-button" type="button" disabled title="Download WSDL and imported XSD schemas as a ZIP file">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5" /></svg>
			Download WSDL
		</button>
	</div>
	<div class="search-box">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m16 16 4.5 4.5" /></svg>
		<input id="method-search" type="search" aria-label="Search methods by name or description" placeholder="Search methods…" autocomplete="off" spellcheck="false" />
		<button id="clear-search" type="button" aria-label="Clear search" hidden>×</button>
		<kbd id="search-shortcut" aria-hidden="true">/</kbd>
	</div>
	<div class="search-summary"><span id="method-count" role="status" aria-live="polite">Loading methods…</span><button id="toggle-groups" class="text-button" type="button" disabled>Collapse all</button></div>
</header>
<main id="tree" aria-label="Service methods">
	<div id="loading-state" class="empty-state">Reading WSDL…</div>
	<ul id="services"></ul>
	<div id="empty-state" class="empty-state" hidden><strong>No matching methods</strong><p>Try a shorter name or a different keyword.</p><button id="reset-search" class="text-button" type="button">Clear search</button></div>
</main>
<p id="popup-message" role="status" aria-live="polite" hidden></p>
<footer class="popup-footer"><span>Select a method to edit and send a request</span><span class="footer-shortcut">↑ ↓ Navigate · Enter Open</span></footer>
<script src="scripts/jquery.min.js"></script>
<script src="scripts/xmlSampleGenerator.js"></script>
<script src="scripts/vkbeautify.js"></script>
<script src="scripts/jszip.js"></script>
<script src="scripts/wsdl.js"></script>
<script src="scripts/popup.js"></script>
</body></html>
